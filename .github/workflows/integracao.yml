name: Integração Petlove
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform web
